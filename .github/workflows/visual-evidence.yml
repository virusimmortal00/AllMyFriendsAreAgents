name: Visual evidence

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      full:
        description: Capture all views instead of changed views
        type: boolean
        default: false
      base:
        description: Comparison branch or commit for changed views
        type: string
        default: origin/main

permissions:
  contents: read

concurrency:
  group: visual-evidence-${{ github.ref }}
  cancel-in-progress: true

jobs:
  capture:
    name: Browser layout and screenshot capture (not visual approval)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run check:visual-types
      - name: Determine affected views
        id: scope
        env:
          VISUAL_BASE: ${{ github.event.pull_request.base.sha || inputs.base || 'origin/main' }}
          VISUAL_FULL: ${{ github.event_name == 'workflow_dispatch' && inputs.full }}
        run: |
          if [ "$VISUAL_FULL" = "true" ]; then
            pnpm run capture:visual --full --plan-only
          else
            pnpm run capture:visual --base "$VISUAL_BASE" --plan-only
          fi
      - if: steps.scope.outputs.required == 'true'
        run: pnpm exec playwright install --with-deps chromium webkit
      - name: Capture affected views
        if: steps.scope.outputs.required == 'true'
        env:
          VISUAL_BASE: ${{ github.event.pull_request.base.sha || inputs.base || 'origin/main' }}
          VISUAL_FULL: ${{ github.event_name == 'workflow_dispatch' && inputs.full }}
        run: |
          if [ "$VISUAL_FULL" = "true" ]; then
            pnpm run capture:visual --full
          else
            pnpm run capture:visual --base "$VISUAL_BASE"
          fi
      - name: Upload evidence even when layout checks fail
        if: always() && steps.scope.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: visual-evidence-${{ github.sha }}
          path: |
            test-results/visual/
            test-results/visual-runtime/
          if-no-files-found: error
          retention-days: 14
